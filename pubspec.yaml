name: gekychat_desktop
description: GekyChat Desktop App - WhatsApp-style chat application for desktop
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^16.2.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0

  # Realtime - Reverb via pure-Dart WebSocket (same as mobile)
  pusher_client_socket: ^0.0.7

  # Offline-first / local DB
  drift: ^2.18.0
  drift_dev: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  path: ^1.8.3
  scrollable_positioned_list: ^0.3.8
  package_info_plus: ^8.3.0
  device_info_plus: ^11.2.0
  mime: ^2.0.0

  # Desktop-specific
  file_picker: ^10.3.2
  image_picker: ^1.1.2
  desktop_drop: ^0.7.0
  pasteboard: ^0.5.0
  cached_network_image: ^3.4.1
  video_player: ^2.8.1
  video_player_win: ^3.2.0
  video_editor: 1.5.2
  # Calls: LiveKit only. flutter_webrtc is for live broadcast screens.
  flutter_webrtc: ^0.11.4
  livekit_client: ^2.2.6
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  json_annotation: ^4.8.1

  # Desktop notifications
  flutter_local_notifications: ^19.4.0

  # Window management and system tray
  window_manager: ^0.3.9
  system_tray: ^2.0.3
  windows_taskbar: ^1.1.2

  # Emoji picker
  emoji_picker_flutter: ^2.0.0
  share_plus: ^10.0.0
  qr_flutter: ^4.1.0
  record: ^5.2.0
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.0

dependency_overrides:
  record_linux: ^1.2.1
  uuid: ^3.0.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/icons/gold_no_text/
    - assets/icons/gold_with_text/
    - assets/icons/white_no_text/
    - assets/icons/white_with_text/

flutter_launcher_icons:
  image_path: "assets/icons/gold_no_text/1024x1024.png"
  windows:
    generate: true
    image_path: "assets/icons/gold_no_text/1024x1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/gold_no_text/1024x1024.png"
  linux:
    generate: true
    image_path: "assets/icons/gold_no_text/1024x1024.png"

# MSIX is optional; public Windows distribution uses Inno Setup (see windows/installer/gekychat.iss).
# Replace publisher with your Authenticode cert CN when you have a code-signing certificate.
msix_config:
  display_name: GekyChat
  publisher_display_name: GekyChat
  identity_name: com.gekychat.desktop
  publisher: CN=GekyChat
  msix_version: 1.0.0.1
  logo_path: assets/icons/gold_no_text/1024x1024.png
  trim_logo: false
  capabilities: internetClient, microphone, webcam, location

# Windows installer: windows/installer/gekychat.iss (built via scripts/release-desktop-windows.ps1)
